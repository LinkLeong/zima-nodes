<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zima Nodes</title>
    <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <img src="icons/icon.png" alt="Zima Nodes" class="logo-icon">
                <h1>Zima Nodes</h1>
            </div>
            <button id="settingsBtn" class="settings-btn" type="button" title="Manage devices">Devices</button>
        </div>

        <!-- Configuration prompt (shown when not configured) -->
        <div id="configPrompt" class="config-prompt hidden">
            <div class="prompt-content">
                <h3>Welcome to Zima Nodes</h3>
                <p>Please configure your ZimaOS connection first</p>
                <button id="configureBtn" class="btn btn-primary">Start Configuration</button>
            </div>
        </div>

        <!-- Main content (shown when configured) -->
        <div id="mainContent" class="main-content hidden">
            <!-- Connection status -->
            <div class="connection-status" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                    <div id="currentDeviceIcon" class="device-icon" style="width:32px;height:32px;"></div>
                    <div style="display:flex;flex-direction:column;min-width:0;">
                        <span id="currentDeviceName" style="font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"></span>
                        <span id="hostInfo" class="host-info" style="font-size:0.85rem;"></span>
                    </div>
                </div>
                <div id="statusIndicator" class="status-indicator offline">
                    <span class="status-dot"></span>
                    <span id="statusText">Offline</span>
                </div>
            </div>

            <!-- Quick access -->
            <div class="quick-access">
                <button id="openZimaBtn" class="quick-btn primary">
                    <span>Open ZimaOS</span>
                </button>
            </div>

            <!-- Apps grid -->
            <div class="apps-section" style="padding-left:8px;padding-right:8px;">
                <h3 class="app-section-title" style="margin-top:8px;margin-left:8px;font-weight:600;color:inherit;">Apps</h3>
                <div id="appsGrid" class="apps-grid">
                    <!-- Default apps -->
                    <div class="app-item" data-url="/files">
                        <div class="app-icon">📁</div>
                        <div class="app-name">File Manager</div>
                    </div>
                    <div class="app-item" data-url="/media">
                        <div class="app-icon">🎵</div>
                        <div class="app-name">Media Center</div>
                    </div>
                    <div class="app-item" data-url="/docker">
                        <div class="app-icon">🐳</div>
                        <div class="app-name">Docker</div>
                    </div>
                    <div class="app-item" data-url="/settings">
                        <div class="app-icon">⚙️</div>
                        <div class="app-name">Settings</div>
                    </div>
                    <div class="app-item" data-url="/terminal">
                        <div class="app-icon">💻</div>
                        <div class="app-name">Terminal</div>
                    </div>
                    <div class="app-item" data-url="/monitoring">
                        <div class="app-icon">📊</div>
                        <div class="app-name">Monitoring</div>
                    </div>
                </div>
            </div>

            <!-- Footer actions -->
            <div class="footer-actions">
                <select id="themeSelect" class="btn btn-secondary small" style="margin-left:auto;">
                    <option value="auto">Follow System</option>
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                </select>
            </div>

        </div>

        <!-- Loading indicator -->
        <div id="loadingIndicator" class="loading hidden">
            <div class="spinner"></div>
            <p>Connecting...</p>
        </div>

        <!-- Device list/settings page -->
        <div id="deviceListPage" class="device-list-page hidden">
            <div class="device-list-header">
                <div>
                    <h2>Device Management</h2>
                    <p id="deviceSummary" class="device-summary">0 devices · 0 online</p>
                </div>
                <button id="backToMainBtn" class="btn btn-secondary small">Back</button>
            </div>
            <div id="deviceList"></div>
            <div class="device-list-actions">
                <button id="refreshDevicesBtn" class="btn btn-secondary">Refresh All</button>
                <button id="addDeviceBtn" class="btn btn-primary">Add Device</button>
            </div>
        </div>
        <!-- Device edit modal -->
        <div id="deviceEditModal" class="modal hidden">
            <div class="modal-content">
                <h3 id="deviceEditTitle">Add Device</h3>
                <form id="deviceEditForm">
                    <input type="hidden" id="deviceId">
                    <div class="form-group">
                        <label for="deviceName">Display name</label>
                        <input type="text" id="deviceName" placeholder="Uses the ZimaOS device name by default">
                    </div>
                    <div class="form-group">
                        <label for="deviceHost">Address</label>
                        <input type="text" id="deviceHost" required placeholder="e.g. http://192.168.1.100:8080">
                    </div>
                    <div class="form-group">
                        <label for="deviceUsername">Username</label>
                        <input type="text" id="deviceUsername" required>
                    </div>
                    <div class="form-group">
                        <label for="devicePassword">Password</label>
                        <input type="password" id="devicePassword" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="modalSaveBtn" class="btn btn-primary">Save</button>
                        <button type="button" id="modalCancelBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="scripts/device-store.js"></script>
    <script src="scripts/zimaos-api.js"></script>
    <script src="scripts/popup.js"></script>
</body>
</html>
