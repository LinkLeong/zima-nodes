<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZimaOS Client - 配置</title>
    <link rel="stylesheet" href="styles/options.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ZimaOS Client Settings</h1>
            <p>Configure your ZimaOS connection</p>
        </header>

        <main>
            <form id="configForm">
                <div class="form-group">
                    <label for="host">ZimaOS Address:</label>
                    <input type="text" id="host" name="host" placeholder="e.g. 192.168.1.100:8080 or zimaos.local" required>
                    <small>Please enter the IP address and port, or domain of ZimaOS</small>
                </div>

                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <button type="button" id="togglePassword" class="toggle-password">Show</button>
                </div>

                <div class="form-actions">
                    <button type="submit" id="saveBtn" class="btn-primary">Save</button>
                    <button type="button" id="testBtn" class="btn-secondary">Test Connection</button>
                </div>
            </form>

            <div id="status" class="status hidden"></div>

            <!-- 录制控制区 -->
            <div id="recordSection" style="margin:16px 0;">
              <button id="startRecordBtn" class="btn btn-primary">Start Recording</button>
              <button id="stopRecordBtn" class="btn btn-secondary" style="display:none;">Stop Recording</button>
              <span id="recordStatus" style="margin-left:12px;color:#d97706;"></span>
            </div>

            <!-- 调试日志区域 -->
            <div class="debug-section">
                <h3>Debug Logs <button type="button" id="clearLogsBtn" class="btn-clear">Clear</button></h3>
                <div id="debugLogs" class="debug-logs"></div>
            </div>
        </main>
    </div>

    <script src="scripts/zimaos-api.js"></script>
    <script src="scripts/options.js"></script>
</body>
</html>
