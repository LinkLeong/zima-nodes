<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zima Nodes - Current Device</title>
    <link rel="stylesheet" href="styles/options.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Current Device</h1>
            <p>Update the selected ZimaOS connection</p>
        </header>

        <main>
            <form id="configForm">
                <div class="form-group">
                    <label for="name">Display name:</label>
                    <input type="text" id="name" name="name" placeholder="Optional device label">
                </div>
                <div class="form-group">
                    <label for="host">ZimaOS Address:</label>
                    <input type="text" id="host" name="host" placeholder="e.g. 192.168.1.100:8080 or zimaos.local" required>
                    <small>Please enter the IP address and port, or domain of ZimaOS</small>
                </div>

                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <button type="button" id="togglePassword" class="toggle-password">Show</button>
                </div>

                <div class="form-actions">
                    <button type="submit" id="saveBtn" class="btn-primary">Save</button>
                    <button type="button" id="testBtn" class="btn-secondary">Test Connection</button>
                </div>
            </form>

            <div id="status" class="status hidden"></div>

            <div class="debug-section">
                <h3>Debug Logs <button type="button" id="clearLogsBtn" class="btn-clear">Clear</button></h3>
                <div id="debugLogs" class="debug-logs"></div>
            </div>
        </main>
    </div>

    <script src="scripts/device-store.js"></script>
    <script src="scripts/zimaos-api.js"></script>
    <script src="scripts/options.js"></script>
</body>
</html>
